name: authoring-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authoring loop gate (changed documents)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          python3 scripts/gate_promote_check.py --changed --base "$BASE"
      - name: ko paper policy
        run: python3 scripts/check_ko_papers.py
      - name: Build
        run: |
          python3 scripts/wiki_builder.py
          python3 scripts/make_index.py
